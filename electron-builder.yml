appId: com.pdfstudio.app
productName: PDF Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.js,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
extraResources:
  - from: resources/tessdata
    to: tessdata
fileAssociations:
  - ext: pdf
    name: PDF-document
    description: PDF-document
    role: Editor
win:
  executableName: PDF-Studio
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Office
npmRebuild: false
