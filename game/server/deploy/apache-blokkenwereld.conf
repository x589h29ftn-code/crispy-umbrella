# Blokkenwereld multiplayer-relay achter Apache (reverse proxy → wss://).
#
# Vooraf eenmalig de benodigde modules aanzetten:
#   a2enmod proxy proxy_http proxy_wstunnel rewrite
#
# Gebruik:
#   1. Vervang mp.jouwdomein.nl door je eigen (sub)domein.
#   2. Kopieer naar /etc/apache2/sites-available/blokkenwereld.conf
#   3. a2ensite blokkenwereld && systemctl reload apache2
#   4. certbot --apache -d mp.jouwdomein.nl
#      (Certbot zet automatisch https/poort 443 erop.)

<VirtualHost *:80>
    ServerName mp.jouwdomein.nl

    ProxyPreserveHost On

    # WebSocket-verkeer (Upgrade: websocket) naar de relay sturen
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8080/$1 [P,L]

    # Overig verkeer (o.a. de health-check op /) gewoon doorproxyen
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
