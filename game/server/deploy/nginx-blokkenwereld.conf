# Blokkenwereld multiplayer-relay achter Nginx (reverse proxy → wss://).
#
# Gebruik:
#   1. Vervang mp.jouwdomein.nl door je eigen (sub)domein.
#   2. Kopieer naar /etc/nginx/sites-available/blokkenwereld en maak een symlink:
#        ln -s /etc/nginx/sites-available/blokkenwereld /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d mp.jouwdomein.nl
#      (Certbot zet automatisch https/poort 443 erop en herschrijft dit bestand.)

server {
    listen 80;
    listen [::]:80;
    server_name mp.jouwdomein.nl;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket-upgrade doorgeven (essentieel — anders verbindt niemand)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # verbindingen lang openhouden (spelers blijven verbonden)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
