# Zelf-hosten op een EU-server. Start met:  docker compose up -d --build
# Vul eerst .env in (kopie van .env.example) met sterke geheimen.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ovp_portaal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ovp}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Niet publiek: alleen bereikbaar binnen het Docker-netwerk.
    expose:
      - '5432'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overschrijft DATABASE_URL zodat hij naar de db-service wijst.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ovp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ovp_portaal}?schema=public
      STORAGE_DIR: /data/documents
      # Ondertekenen gaat naar de sealer, valideren naar de validator. Zonder deze
      # scheiding zou de publieke controlepagina de container met de
      # ondertekengegevens aanspreken.
      SEALER_URL: ${SEALER_URL:-http://sealer:8000}
      SEALER_VALIDATE_URL: ${SEALER_VALIDATE_URL:-http://validator:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents
    expose:
      - '3000'

  # Achtergrondwerker: verzegeling opnieuw proberen, herinneringen, opruimen.
  # Zelfde image als web, andere opdracht. Houd het op één instance.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ovp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ovp_portaal}?schema=public
      STORAGE_DIR: /data/documents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents
    # --conditions react-server: laat de 'server-only'-markering buiten Next
    # oplossen naar een lege module in plaats van te gooien.
    command: ['node_modules/.bin/tsx', '--conditions', 'react-server', 'scripts/worker.ts']

  # Cryptografische verzegeling (PAdES) met pyHanko. BEWUST NIET publiek:
  # geen ports-blok en geen Caddy-route, alleen bereikbaar op het interne
  # compose-netwerk. Zet SEAL_MODE=sealer in .env om hem te gebruiken.
  sealer:
    build:
      context: ./sealer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEALER_SHARED_SECRET: ${SEALER_SHARED_SECRET:?zet SEALER_SHARED_SECRET in .env}
      SEAL_DRIVER: ${SEAL_DRIVER:-csc}
      PADES_LEVEL: ${PADES_LEVEL:-lt}
      TSA_URL: ${TSA_URL:-}
      TSA_AUTH_MODE: ${TSA_AUTH_MODE:-none}
      TSA_USERNAME: ${TSA_USERNAME:-}
      TSA_PASSWORD: ${TSA_PASSWORD:-}
      TSA_TIMEOUT_MS: ${TSA_TIMEOUT_MS:-10000}
      # CSC-driver (Digidentity/Cleverbase):
      SEAL_CSC_BASE_URL: ${SEAL_CSC_BASE_URL:-}
      SEAL_CSC_CREDENTIAL_ID: ${SEAL_CSC_CREDENTIAL_ID:-}
      SEAL_CSC_OAUTH_TOKEN: ${SEAL_CSC_OAUTH_TOKEN:-}
      SEAL_CSC_SAD: ${SEAL_CSC_SAD:-}
      # GlobalSign DSS-driver:
      SEAL_DSS_API_BASE: ${SEAL_DSS_API_BASE:-}
      SEAL_DSS_API_KEY: ${SEAL_DSS_API_KEY:-}
      SEAL_DSS_API_SECRET: ${SEAL_DSS_API_SECRET:-}
      SEAL_DSS_SIGNER_ID: ${SEAL_DSS_SIGNER_ID:-}
      SEAL_DSS_CERT_PEM: ${SEAL_DSS_CERT_PEM:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "X-Sealer-Secret: $${SEALER_SHARED_SECRET}"
          http://localhost:8000/health || exit 1
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    expose:
      - '8000'

  # Dezelfde image, andere rol: alleen valideren, géén ondertekengegevens.
  #
  # Waarom apart. /validate is het enige eindpunt dat via de publieke controlepagina
  # bereikbaar is en dat bestanden van buiten door een PDF-parser haalt. Die parser
  # hoort niet in dezelfde container te staan als de sleutelgegevens van het zegel.
  #
  # VALIDATOR_ONLY=true doet twee dingen: het proces weigert te starten als er tóch
  # ondertekengegevens in zijn omgeving staan (de omgekeerde grendel — anders belandt
  # er over een half jaar één gedeeld env-bestand in beide services), en /seal,
  # /prepare en /inject geven 403.
  #
  # Let op: hieronder staan bewust GEEN SEAL_*- of TSA_PASSWORD-variabelen. Zet ze
  # hier ook niet "voor de zekerheid" bij; de container start dan niet.
  validator:
    build:
      context: ./sealer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEALER_SHARED_SECRET: ${SEALER_SHARED_SECRET:?zet SEALER_SHARED_SECRET in .env}
      VALIDATOR_ONLY: 'true'
    # PDF-bommen zijn hier de goedkoopste aanval; begrens wat één container kan opeten.
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "X-Sealer-Secret: $${SEALER_SHARED_SECRET}"
          http://localhost:8000/health || exit 1
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
    expose:
      - '8000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Zet PORTAL_DOMAIN in .env, bv. portaal.ottovisseraccountants.nl
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?zet PORTAL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optionele virusscan op uploads. Zet VIRUS_SCAN=clamav in .env om dit te
  # gebruiken en verwijder dan het commentaar hieronder. clamd vraagt ~1-2 GB
  # geheugen (voor de virusdefinities).
  # clamav:
  #   image: clamav/clamav:latest
  #   restart: unless-stopped
  #   volumes:
  #     - clamav_db:/var/lib/clamav
  #   expose:
  #     - '3310'

volumes:
  # clamav_db:
  pgdata:
  documents:
  caddy_data:
  caddy_config:
