# Zelf-hosten op een EU-server. Start met:  docker compose up -d --build
# Vul eerst .env in (kopie van .env.example) met sterke geheimen.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ovp_portaal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ovp}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Niet publiek: alleen bereikbaar binnen het Docker-netwerk.
    expose:
      - '5432'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overschrijft DATABASE_URL zodat hij naar de db-service wijst.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ovp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ovp_portaal}?schema=public
      STORAGE_DIR: /data/documents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Zet PORTAL_DOMAIN in .env, bv. portaal.ottovisseraccountants.nl
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?zet PORTAL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optionele virusscan op uploads. Zet VIRUS_SCAN=clamav in .env om dit te
  # gebruiken en verwijder dan het commentaar hieronder. clamd vraagt ~1-2 GB
  # geheugen (voor de virusdefinities).
  # clamav:
  #   image: clamav/clamav:latest
  #   restart: unless-stopped
  #   volumes:
  #     - clamav_db:/var/lib/clamav
  #   expose:
  #     - '3310'

volumes:
  # clamav_db:
  pgdata:
  documents:
  caddy_data:
  caddy_config:
