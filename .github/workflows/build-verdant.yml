name: Bouw Verdant (Windows)

on:
  push:
    branches: [claude/procedural-terrain-game-igtyi4]
    tags: ['verdant-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        # --publish never: electron-builder probeert anders zelf te publiceren
        # zodra hij CI detecteert. De artifact-upload en release-stap hieronder
        # zijn onze distributiekanalen.
        run: npm run build:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdant-windows
          path: game/dist/*.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release with the exe
        # Maakt de tag verdant-v<versie> en de bijbehorende release aan (of
        # werkt de bestaande bij), zodat er altijd een directe downloadlink is.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verdant-v${{ steps.version.outputs.version }}
          name: Verdant v${{ steps.version.outputs.version }}
          body: |
            Low-poly openwereldspel: procedureel gegenereerde werelden met bossen,
            velden, heuvels en zee. Rondlopen, springen, zwemmen, bouwen met blokken,
            dag/nachtcyclus, dieren en rustgevende muziek.

            **Download:** `Verdant-…-setup.exe` (installer) of `Verdant ….exe` (portable, direct starten).
          files: game/dist/*.exe
