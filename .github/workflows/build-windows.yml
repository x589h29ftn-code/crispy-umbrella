name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        # --publish never: electron-builder auto-publishes when it detects CI,
        # which fails without a GH_TOKEN; the upload-artifact step below is our
        # distribution channel instead.
        #
        # Code signing: als de secrets WINDOWS_CSC_LINK (base64 van het
        # .pfx-certificaat) en WINDOWS_CSC_KEY_PASSWORD bestaan, wordt de build
        # automatisch ondertekend. Zonder die secrets wordt CSC_LINK NIET gezet
        # (een lege CSC_LINK laat electron-builder crashen) en is de build gewoon
        # ongetekend. Zie CODE-SIGNING.md. Dit haalt de SmartScreen-waarschuwing weg.
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "Certificaat gevonden — installer wordt ondertekend."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
          else
            echo "Geen certificaat-secret — ongetekende build."
          fi
          npm run build:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        # latest.yml is the electron-updater feed: installed apps poll the
        # newest release for it and update themselves when the version bumps.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
