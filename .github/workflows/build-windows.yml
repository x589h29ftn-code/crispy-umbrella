name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        # --publish never: electron-builder auto-publishes when it detects CI,
        # which fails without a GH_TOKEN; the upload-artifact step below is our
        # distribution channel instead.
        #
        # Code signing: electron-builder ondertekent automatisch zodra de secrets
        # WINDOWS_CSC_LINK (base64 van het .pfx-certificaat) en
        # WINDOWS_CSC_KEY_PASSWORD in de repo staan. Zonder die secrets zijn deze
        # variabelen leeg en wordt de build gewoon ongetekend gemaakt (zoals nu).
        # Zie CODE-SIGNING.md voor het toevoegen van een certificaat of Azure
        # Trusted Signing. Dit haalt de Windows SmartScreen-waarschuwing weg.
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        # latest.yml is the electron-updater feed: installed apps poll the
        # newest release for it and update themselves when the version bumps.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
