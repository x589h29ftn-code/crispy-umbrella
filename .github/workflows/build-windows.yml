name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable exe
        # --publish never: electron-builder auto-publishes when it detects CI,
        # which fails without a GH_TOKEN; the upload-artifact step below is our
        # distribution channel instead.
        run: npm run build:win -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
