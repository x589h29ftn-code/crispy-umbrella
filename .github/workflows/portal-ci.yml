name: Portal CI

# Typecheck + build van het ondertekenportaal. Los van de desktop-pipeline.
#
# Alleen handmatig starten (workflow_dispatch). In dit account is (nog) geen
# GitHub Actions-runner beschikbaar, waardoor een automatische run bij elke push
# blijft wachten in de wachtrij en uiteindelijk als "mislukt" een faal-mail
# stuurt. Zodra er een runner beschikbaar is (GitHub-hosted of self-hosted),
# kunnen de push-/pull_request-triggers hieronder weer aangezet worden:
#
#   push:
#     branches: ['**']
#     paths: ['portal/**', '.github/workflows/portal-ci.yml']
#   pull_request:
#     paths: ['portal/**', '.github/workflows/portal-ci.yml']
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      # Dummywaarden — de build maakt geen databaseverbinding.
      DATABASE_URL: postgresql://u:p@localhost:5432/db?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
